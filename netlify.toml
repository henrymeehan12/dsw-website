[build]
  # The five case-study pages under work/ still contain [FILL: …] placeholders
  # and unreleased customer detail. They stay in the repo but are stripped from
  # the build so they are neither live nor indexable. Delete this command line
  # (and nothing else) when the pages are finished and ready to publish.
  command = "rm -rf work"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true
