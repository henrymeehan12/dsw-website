[build]
  # work/  — five case-study pages with [FILL: …] placeholders and unreleased
  #          customer detail; kept in git, never deployed.
  # _tools/ — source HTML for DSW-Capabilities-Sheet.pdf (re-render with
  #          Chrome "Print to PDF", Letter, no margins, background graphics on).
  # Neither is deployed. Remove "work" from the command when the case studies
  # are ready to publish.
  command = "rm -rf work _tools"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true
